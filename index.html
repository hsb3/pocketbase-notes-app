<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A private place for notes, ideas, and everyday reflections." />
  <meta name="color-scheme" content="light dark" />
  <!-- Sets the theme before first paint. Mirrors src/features/theme/theme.ts. -->
  <script>
    (function () {
      var theme;
      try {
        theme = localStorage.getItem("theme");
      } catch {
        /* storage blocked: follow the system */
      }
      var dark = theme === "dark" ||
        (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.classList.toggle("dark", dark);
      document.documentElement.style.colorScheme = dark ? "dark" : "light";
    })();
  </script>
  <title>PocketBase Notes — Notes &amp; Journal</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
