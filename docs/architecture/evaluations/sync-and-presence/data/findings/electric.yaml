candidate: electric
checked_on: "2026-11-21"
kind: candidate
repo: "https://github.com/neondatabase/electric"
layer_fit:
  verdict: in-layer
  note: "Read-path sync engine for Postgres: an Elixir sync service streams 'shapes' of Postgres tables to clients over HTTP. Writes go through the app's own API; y-electric is a Yjs provider over Electric plus Postgres."
license:
  components:
    - {name: "repo root", license: Apache-2.0, source: "https://github.com/neondatabase/electric/blob/main/LICENSE"}
    - {name: "sync-service (Elixir server, Docker image electricsql/electric)", license: Apache-2.0, source: "https://github.com/neondatabase/electric/blob/main/packages/sync-service/LICENSE"}
    - {name: "@electric-sql/client (TypeScript client)", license: Apache-2.0, source: "https://github.com/neondatabase/electric/blob/main/packages/typescript-client/package.json"}
    - {name: "@electric-sql/y-electric (Yjs provider)", license: Apache-2.0, source: "https://github.com/neondatabase/electric/blob/main/packages/y-electric/package.json"}
phone_home:
  telemetry: none
  license_key: false
  evidence: "sync-service CHANGELOG 1.7.12: 'Remove the call-home reporter that sent anonymous usage data to checkpoint.electric-sql.com. Electric no longer phones home; the ELECTRIC_USAGE_REPORTING and ELECTRIC_TELEMETRY_URL environment variables are gone.' Remaining OpenTelemetry/StatsD/Prometheus export is opt-in (config docs, Telemetry section)."
filters:
  - id: osi-license
    verdict: pass
    evidence: "Root, sync-service and elixir-client LICENSE files are Apache-2.0; JS packages declare Apache-2.0."
    source: "https://github.com/neondatabase/electric/blob/main/packages/sync-service/LICENSE"
  - id: self-hosted-no-key
    verdict: pass
    evidence: "Self-hosted Docker image; only DATABASE_URL and ELECTRIC_SECRET required; no call-home since 1.7.12."
    source: "https://github.com/neondatabase/electric/blob/main/website/docs/sync/api/config.md"
  - id: pocketbase-record
    verdict: fail
    evidence: "Installation guide: 'You need to have a Postgres database and to run the Electric sync service in front of it.' It reads Postgres logical replication; PocketBase's SQLite cannot be a source."
    source: "https://github.com/neondatabase/electric/blob/main/website/docs/sync/guides/installation.md"
capabilities:
  - {id: no-false-conflict, verdict: partial, note: "Electric has no write path; merge rules live in our API. Rows sync as whole-row shape updates.", source: "https://github.com/neondatabase/electric/blob/main/website/docs/sync/guides/writes.md"}
  - {id: text-merge, verdict: partial, note: "Via y-electric (Yjs updates stored in Postgres, merged by Yjs); Electric itself has no text type.", source: "https://github.com/neondatabase/electric/blob/main/packages/y-electric/README.md"}
  - {id: edit-queue, verdict: partial, note: "Writes guide gives patterns (online, optimistic, shared persistent optimistic state, through-the-DB); no packaged durable queue in Electric itself (it points to TanStack DB).", source: "https://github.com/neondatabase/electric/blob/main/website/docs/sync/guides/writes.md"}
  - {id: presence, verdict: partial, note: "y-electric 'supports Awareness' (y-protocols), but only with the Electric plus Postgres stack.", source: "https://github.com/neondatabase/electric/blob/main/packages/y-electric/README.md"}
  - {id: live-update, verdict: "yes", note: "Shapes stream Postgres changes to clients live over HTTP long-polling; requires Postgres.", source: "https://github.com/neondatabase/electric/blob/main/website/docs/sync/guides/shapes.md"}
  - {id: prosemirror-binding, verdict: partial, note: "Only indirectly: y-electric is a Yjs provider, so y-prosemirror (Yjs project) would bind the editor.", source: "https://github.com/neondatabase/electric/blob/main/packages/y-electric/README.md"}
  - {id: pocketbase-auth, verdict: partial, note: "Auth is done by an authorizing proxy in front of the shape API; a PocketBase route could proxy with the user token, but the data still lives in Postgres.", source: "https://github.com/neondatabase/electric/blob/main/website/docs/sync/guides/auth.md"}
  - {id: server-derivation, verdict: partial, note: "Derivation would have to run against Postgres rows (or Yjs blobs in Postgres), not PocketBase hooks.", source: "https://github.com/neondatabase/electric/blob/main/website/docs/sync/guides/writes.md"}
  - {id: single-image, verdict: "no", note: "Adds the Elixir sync service and a Postgres with logical replication.", source: "https://github.com/neondatabase/electric/blob/main/website/docs/sync/guides/installation.md"}
biases:
