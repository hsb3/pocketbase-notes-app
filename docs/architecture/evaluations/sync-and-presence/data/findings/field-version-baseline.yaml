  note: "Hand-built change to the baseline: keep the body revision for content saves only; metadata (pin, folder, deleted) gets property-level last-writer-wins or its own version, so a pin never refuses a body save. Pattern from Figma/Linear property-level resolution (see landscape.yaml)."
capabilities:
