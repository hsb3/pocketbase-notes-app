  - {id: server-derivation, verdict: "yes", note: "Unchanged hooks.", source: "https://github.com/hsb3/pocketbase-notes-app/blob/b895d10/pb/hooks/entry-validation.js"}
  - {id: single-image, verdict: "yes", note: "No extra service.", source: "https://github.com/hsb3/pocketbase-notes-app/blob/b895d10/deploy/docker/Dockerfile"}
biases:
