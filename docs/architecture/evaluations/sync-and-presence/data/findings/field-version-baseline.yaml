  - {id: text-merge, verdict: "no", note: "Body stays whole-document optimistic concurrency.", source: "https://github.com/hsb3/pocketbase-notes-app/blob/b895d10/pb/hooks/notes.pb.js"}
  - {id: edit-queue, verdict: partial, note: "Same in-memory queue as today unless a persisted outbox is added.", source: "https://github.com/hsb3/pocketbase-notes-app/blob/b895d10/src/features/notes/draft.ts"}
  - {id: presence, verdict: "no", note: "Needs a transport such as PocketBase realtime; evaluated separately.", source: "https://github.com/hsb3/pocketbase-notes-app/blob/b895d10/src/features/notes/workspace.tsx"}
  - {id: live-update, verdict: "no", note: "Same; pairs naturally with PocketBase record subscriptions.", source: "https://github.com/hsb3/pocketbase-notes-app/blob/b895d10/src/features/notes/note-list.tsx"}
