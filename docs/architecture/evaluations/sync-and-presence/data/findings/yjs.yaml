verification:
  - claim: "PocketBase 0.40.1 JSVM can load bundled yjs 13.6.33 + y-prosemirror 1.3.7 and decode a Y update to the same ProseMirror document."
    outcome: verified
    checked_on: "2026-11-21"
    evidence: "Contained run (Docker, capped): byte-equal to Bun output, Node.eq to the source note; 0.76 ms average decode. Shims: globalThis.crypto.getRandomValues stub and a base64 decoder; all libraries in one 172 kB minified bundle. Not measured: memory per pooled VM, large notes, request-path hooks."
  - claim: "dmonad authors about 90% of yjs commits; v14 RC renames packages to @y/y and @y/prosemirror; y-indexeddb last release 2023-11-02."
    outcome: refuted
    correction: "86 of 100 commits (86%). @y/y is at 14.0.0-rc.x; @y/prosemirror is on 2.0.0 prereleases, not RC. y-indexeddb date verified."
    checked_on: "2026-11-21"
    evidence: "GitHub commits API; npm registry dist-tags."
