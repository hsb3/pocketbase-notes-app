  - {id: self-hosted-no-key, verdict: pass, evidence: "Client library; the authority is ours.", source: "https://prosemirror.net/docs/guide/#collab"}
  - {id: pocketbase-record, verdict: pass, evidence: "Protocol is storage-agnostic; doc, version and steps can be PocketBase record fields or a steps collection.", source: "https://prosemirror.net/docs/guide/#collab"}
capabilities:
  - {id: no-false-conflict, verdict: partial, note: "Covers the body only. Holds if the body version is split from the metadata revision (our change in notes.pb.js / note-actions.pb.js); otherwise a move still bumps the shared counter.", source: "https://prosemirror.net/docs/guide/#collab"}
  - {id: text-merge, verdict: "yes", note: "Rejected batches are rebased over accepted steps and resubmitted; both edits kept without a dialog (a step that cannot be mapped is dropped).", source: "https://code.haverbeke.berlin/prosemirror/prosemirror-collab/src/branch/main/src/collab.ts"}
  - {id: edit-queue, verdict: partial, note: "Ordered unconfirmed-step queue with resend after rejection and dedupe by clientID on confirm. Lives in editor plugin state only: surviving reload means persisting sendableSteps and restoring with the same version and clientID ourselves.", source: "https://code.haverbeke.berlin/prosemirror/prosemirror-collab/src/branch/main/src/collab.ts"}
  - {id: presence, verdict: "no", note: "Module has no presence or cursor API.", source: "https://prosemirror.net/docs/ref/#collab"}
  - {id: live-update, verdict: partial, note: "Protocol needs a 'steps since version' feed but ships no transport (guide demo uses long polling); PocketBase realtime could carry it.", source: "https://prosemirror.net/docs/guide/#collab"}
  - {id: prosemirror-binding, verdict: "yes", note: "It is the ProseMirror core collab module; ProseKit accepts raw ProseMirror plugins.", source: "https://prosemirror.net/docs/ref/#collab"}
  - {id: pocketbase-auth, verdict: partial, note: "No auth of its own; transport-agnostic, so an authority route behind $apis.requireAuth('users') with the owner check gives PocketBase auth.", source: "https://prosemirror.net/docs/guide/#collab"}
  - {id: server-derivation, verdict: "yes", note: "Proved 2026-11-21: Step.fromJSON(...).apply(doc) runs in PocketBase 0.40.1 JSVM from one bundled CJS file. If the authority stores the resulting doc JSON in notes.body, the current JSVM derivation is unchanged. Applying steps on the server in goja is undocumented (goja 'most of ES6', CommonJS only); trusting the client's resulting doc avoids that for one owner.", source: "https://pocketbase.io/docs/js-overview/"}
  - {id: single-image, verdict: "yes", note: "Authority fits in pb_hooks; no extra service.", source: "https://prosemirror.net/docs/guide/#collab"}
biases:
  - {id: reuse-over-build, met: false, note: "Reuses the client half (rebase, queue); the authority, storage, transport and persistence are DIY."}
  - {id: small-change, met: false, note: "Smaller than a CRDT server (no new service) but rewrites draft.ts around steps and adds a steps store, an authority route and step pruning."}
