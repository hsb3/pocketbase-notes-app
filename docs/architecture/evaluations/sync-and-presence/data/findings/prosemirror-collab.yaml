repo: "https://code.haverbeke.berlin/prosemirror/prosemirror-collab"
layer_fit:
  verdict: in-layer
  note: "ProseMirror's own central-authority protocol. Client: the collab plugin keeps version plus unconfirmed steps; sendableSteps(state) gives {version, steps, clientID}; receiveTransaction(state, steps, clientIDs) confirms own steps by clientID and rebases the rest over remote steps (rebaseSteps maps and re-applies, dropping steps that no longer apply). Authority must: track a version (= steps accepted), accept a batch only if its version equals the current one, append steps with clientIDs, and serve steps since a version; it must keep step history back to the oldest client version or force a reload, and keep (or be able to rebuild) the current doc. Integration effort: DIY on a documented protocol (guide 'Collaborative editing'). A PocketBase JSVM route can be the authority: the version check and append fit runInTransaction like today's revision check, and PocketBase realtime can push new steps. Applying steps server-side needs prosemirror-model/transform plus our schema bundled to CommonJS for goja (undocumented whether it runs); alternatively the single-owner client sends the resulting doc with its steps."
license:
  components:
    - {name: "prosemirror-collab 1.3.1", license: MIT, source: "https://code.haverbeke.berlin/prosemirror/prosemirror-collab/src/branch/main/LICENSE"}
    - {name: "prosemirror-transform / prosemirror-model (needed by a step-applying authority)", license: MIT, source: "https://code.haverbeke.berlin/prosemirror/prosemirror/src/branch/main/LICENSE"}
