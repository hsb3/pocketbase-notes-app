      evidence: "Sampled view, state, language, commands, autocomplete and lang-javascript since 2026-05-21: Marijn Haverbeke wrote 127 of 131 commits, and 5 other people made one commit each. That is 1 recurring contributor with no institutional backing, so the floor of 2 fails. ProseMirror, under the incumbent, has the same single-maintainer shape."
