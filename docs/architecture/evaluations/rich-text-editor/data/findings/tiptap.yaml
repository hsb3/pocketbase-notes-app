    outcome: verified
    checked_on: "2026-11-21"
    evidence: "npm registry; tiptap-docs frontmatter isFree false/true; extension-collaboration dependencies."
  - claim: "Stock node names differ from ProseKit (bulletList/taskItem vs list; tableHeader vs tableHeaderCell; blockMath/inlineMath with latex attr vs mathBlock/mathInline)."
    outcome: verified
    checked_on: "2026-11-21"
    evidence: "Source of both projects. Extra: ProseKit mathBlock keeps the formula as text content; Tiptap keeps it in a latex attribute."
