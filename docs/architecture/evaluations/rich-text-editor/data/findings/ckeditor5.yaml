verification:
  - claim: "GPL-2.0-or-later; licenseKey required and 'GPL' is accepted locally with no usage request; logo always shown for free users; to-do list, table selection and upload adapter are in GPL packages; collaboration and slash commands commercial; HTML data model; no live code highlighting."
    outcome: verified
    correction: "Two caveats: a GPL key used from the CKEditor CDN (cloud channel) makes the editor read-only, so GPL works only for npm or ZIP installs; the logo rule is vendor policy, not a GPL term."
    checked_on: "2026-11-21"
    evidence: "packages/ckeditor5-core/src/editor/editor.ts; LICENSE.md per package; managing-ckeditor-logo.md; DataController HtmlDataProcessor; code-blocks docs."
