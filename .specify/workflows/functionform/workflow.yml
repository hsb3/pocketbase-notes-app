schema_version: "1.0"
workflow:
  id: "functionform"
  name: "functionform SDD cycle"
  version: "0.1.0"
  author: "functionform"
  description: "specify → plan → tasks → analyze with three review gates, then implement, converge and the project gate, fixing until the gate is green (3 tries)"

requires:
  speckit_version: ">=1.3.0"

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe what you want to build"
  integration:
    type: string
    default: "auto"
    prompt: "Integration to use ('auto' uses the project's default)"

# Needs the functionform-gate extension: the gate steps run its script.
steps:
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-spec
    type: gate
    message: "Review the spec. Run /speckit-clarify yourself first if anything is vague, then approve."
    options: [approve, reject]
    on_reject: abort

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-plan
    type: gate
    message: "Review the plan before generating tasks."
    options: [approve, reject]
    on_reject: abort

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: analyze
    command: speckit.analyze
    integration: "{{ inputs.integration }}"

  - id: review-tasks
    type: gate
    message: "Review the tasks and the analysis report above. Approve to start implementation."
    options: [approve, reject]
    on_reject: abort

  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      # The workflow runs the gate itself in the next steps, so the hook's run would only repeat it.
      args: "{{ inputs.spec }} (Skip the functionform-gate after-implement hook: this workflow runs the gate next.)"

  - id: converge
    command: speckit.converge
    integration: "{{ inputs.integration }}"

  - id: gate-loop
    type: do-while
    condition: "{{ steps.gate.output.exit_code != 0 }}"
    max_iterations: 3
    steps:
      - id: gate
        type: shell
        strict: true
        timeout: 3600
        continue_on_error: true
        run: ".specify/extensions/functionform-gate/scripts/gate.sh full > .specify/extensions/functionform-gate/last-run.log 2>&1"
      - id: fix-if-red
        type: if
        condition: "{{ steps.gate.output.exit_code != 0 }}"
        then:
          - id: fix
            type: prompt
            integration: "{{ inputs.integration }}"
            timeout: 1800
            prompt: "The project gate failed. Read the end of .specify/extensions/functionform-gate/last-run.log, find the cause and fix it in the code. Do not edit the gate command, skip or weaken a test, or add retries. Do not rerun the full gate yourself; the workflow reruns it."

  # The last fix has not been checked yet, so a red loop ends with one hard run that fails the workflow.
  - id: verify
    type: if
    condition: "{{ steps.gate.output.exit_code != 0 }}"
    then:
      - id: final-gate
        type: shell
        strict: true
        timeout: 3600
        run: ".specify/extensions/functionform-gate/scripts/gate.sh full > .specify/extensions/functionform-gate/last-run.log 2>&1"
