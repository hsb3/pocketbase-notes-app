name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bunx tsc -p scripts/tsconfig.json
      - run: bun run build

  e2e:
    name: E2E (${{ matrix.arch }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium webkit
      - name: Configure disposable services
        shell: bash
        run: |
          encryption_key=$(openssl rand -hex 16)
          admin_password=$(openssl rand -hex 24)
          storage_secret=$(openssl rand -hex 24)
          echo "::add-mask::$encryption_key"
          echo "::add-mask::$admin_password"
          echo "::add-mask::$storage_secret"
          cat > .env <<ENV
          PB_ENCRYPTION_KEY=$encryption_key
          PB_PORT=8080
          VITE_PB_URL=http://127.0.0.1:8080
          PB_EMAIL=ci-admin@example.test
          PB_PASSWORD=$admin_password
          RUSTFS_ACCESS_KEY=CIACCESSKEY
          RUSTFS_SECRET_KEY=$storage_secret
          RUSTFS_BUCKET=pocketbase
          DEV_APP_URL=http://127.0.0.1:4173
          ENV
      - name: Build and start full stack
        run: make up-full
      - name: Run API and browser tests
        run: bun run test:e2e
      - name: Collect service logs
        if: always()
        run: |
          mkdir -p ci-artifacts
          if [ -f .env ]; then
            docker compose --project-directory . -f deploy/local/docker-compose-full.yml logs --no-color > ci-artifacts/services.log 2>&1
          fi
      - name: Save test reports and service logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.arch }}
          path: |
            playwright-report/
            test-results/
            ci-artifacts/
          retention-days: 7
          if-no-files-found: warn
      - name: Stop disposable services
        if: always()
        run: |
          if [ -f .env ]; then
            make down-full
          fi
