name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun test scripts/local-target.test.ts
      - run: bun run lint
      - run: bun run knip
      - run: python3 scripts/ai-context.py check
      - run: bunx tsc -p scripts/tsconfig.json
      - run: bun run build

  docs-links:
    name: Docs links
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Offline: relative links and heading anchors only, so external sites cannot fail the job.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --offline --include-fragments --no-progress --exclude-path .agents/skills --exclude-path .claude/skills --exclude-path .specify/templates '**/*.md'
          fail: true
          failIfEmpty: true

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          docker run --rm --network none -v "$PWD:/repo:ro" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  e2e:
    name: E2E (${{ matrix.arch }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium webkit
      - name: Configure disposable services
        shell: bash
        run: |
          encryption_key=$(openssl rand -hex 16)
          admin_password=$(openssl rand -hex 24)
          storage_secret=$(openssl rand -hex 24)
          echo "::add-mask::$encryption_key"
          echo "::add-mask::$admin_password"
          echo "::add-mask::$storage_secret"
          cat > .env <<ENV
          PB_ENCRYPTION_KEY=$encryption_key
          PB_PORT=8080
          VITE_PB_URL=http://127.0.0.1:8080
          PB_EMAIL=ci-admin@example.test
          PB_PASSWORD=$admin_password
          RUSTFS_ACCESS_KEY=CIACCESSKEY
          RUSTFS_SECRET_KEY=$storage_secret
          RUSTFS_BUCKET=pocketbase
          DEV_APP_URL=http://127.0.0.1:4173
          ENV
      - name: Build and start full stack
        run: make up-full
      - name: Run API and browser tests
        run: bun run test:e2e
      - name: Verify account lifecycle and deployment drills
        run: bun run test:accounts
      - name: Verify explicitly enabled registration
        run: |
          VITE_SIGNUP_ENABLED=true docker compose --project-directory . -f deploy/local/docker-compose-full.yml up -d --no-deps --wait pocketbase
          VITE_SIGNUP_ENABLED=true PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report/signup-enabled bunx playwright test tests/e2e/registration-enabled.spec.cjs --output=test-results/signup-enabled
      - name: Collect service logs
        if: always()
        run: |
          mkdir -p ci-artifacts
          if [ -f .env ]; then
            docker compose --project-directory . -f deploy/local/docker-compose-full.yml logs --no-color > ci-artifacts/services.log 2>&1
          fi
      - name: Save test reports and service logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.arch }}
          path: |
            playwright-report/
            test-results/
            ci-artifacts/
          retention-days: 7
          if-no-files-found: warn
      - name: Stop disposable services
        if: always()
        run: |
          if [ -f .env ]; then
            make down-full
          fi
