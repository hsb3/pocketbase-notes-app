name: Feature request
description: Suggest something the app should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or need, in your own words.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: The behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: Anything you tried or considered instead.
