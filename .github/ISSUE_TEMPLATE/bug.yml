name: Bug report
description: Something does not work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in
        2. Open a note
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release tag, or the output of `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: How are you running it?
      options:
        - Local development (make start)
        - Local full stack (make start-full or make stack-up)
        - Railway
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Safari 26 on macOS
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Browser console output, `make logs` output or screenshots. Remove passwords, tokens and private note content first.
